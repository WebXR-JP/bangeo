<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Overlay</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>DOM Overlay</h3>
        <div class="desc">domOverlayStateを利用し、WebXRコンテンツ上にDOM UIを重ねる表示テスト。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        
        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333);
            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 10);
            
            // DOM Element
            const overlay = document.createElement('div');
            overlay.id = 'overlay';
            overlay.style.position = 'absolute';
            overlay.style.top = '50px';
            overlay.style.left = '50px';
            overlay.style.width = '200px';
            overlay.style.height = '100px';
            overlay.style.background = 'rgba(255, 255, 255, 0.8)';
            overlay.style.padding = '20px';
            overlay.innerHTML = '<h1>DOM Overlay</h1><button onclick="alert(\'Clicked!\')">Click Me</button>';
            document.body.appendChild(overlay);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.xr.enabled = true;
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            
            document.body.appendChild(ARButton.createButton(renderer, {
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            }));
        }
        function animate() { renderer.setAnimationLoop(render); }
        function render() { renderer.render(scene, camera); }
    
    </script>
</body>
</html>
