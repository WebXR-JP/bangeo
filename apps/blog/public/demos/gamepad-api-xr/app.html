<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamepad API for XR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Gamepad API for XR</h3>
        <div class="desc">Gamepad APIを用いてXRInputSource.gamepadを読み取り、ボタン/軸/ハプティクスを処理する汎用パターン。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        let logText;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202020);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            // Log board
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,1024,512);
            const texture = new THREE.CanvasTexture(canvas);
            const plane = new THREE.Mesh(
                new THREE.PlaneGeometry(2, 1),
                new THREE.MeshBasicMaterial({ map: texture })
            );
            plane.position.set(0, 1.6, -2);
            scene.add(plane);

            logText = { canvas, ctx, texture };

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            // Setup controllers just to activate input sources
            renderer.xr.getController(0);
            renderer.xr.getController(1);

            window.addEventListener('resize', onWindowResize);
        }

        function updateStatus() {
            const { ctx, texture, canvas } = logText;
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = '30px monospace';
            
            const session = renderer.xr.getSession();
            if (!session) {
                ctx.fillText("No XR Session", 50, 50);
            } else {
                ctx.fillText("Input Sources:", 50, 50);
                let y = 100;
                for (let i = 0; i < session.inputSources.length; i++) {
                    const source = session.inputSources[i];
                    const handedness = source.handedness;
                    const gamepad = source.gamepad;
                    
                    let text = `[${i}] ${handedness} - ${source.targetRayMode}`;
                    if (gamepad) {
                        const buttons = gamepad.buttons.map(b => b.pressed ? "1" : "0").join("");
                        const axes = gamepad.axes.map(a => a.toFixed(2)).join(", ");
                        text += ` | Btns: ${buttons} | Axes: [${axes}]`;
                    } else {
                        text += " | No Gamepad";
                    }
                    
                    ctx.fillText(text, 50, y);
                    y += 50;
                }
            }
            texture.needsUpdate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            updateStatus();
            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
