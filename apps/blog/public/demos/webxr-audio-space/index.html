<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR Audio Space | BANGEO WebXR Lab</title>
  <link rel="icon" type="image/png" href="https://www.bangeo.net/favicon.png">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0b16; }
    canvas { display: block; }
    .hud {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      pointer-events: none;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    }
    .hud .card {
      width: min(460px, 100%);
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px; padding: 12px 14px; color: #e5e7eb;
    }
    .hud h1 { margin: 0 0 4px; font-size: 14px; }
    .hud p { margin: 0; font-size: 11.5px; line-height: 1.6; color: #9ca3af; }
    .hud .state { margin-top: 6px; font-size: 11px; font-weight: 900; color: #fda4af; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="card">
      <h1>WebXR Audio Space</h1>
      <p>4色の球体がそれぞれ違う高さの音を出しています。頭（視点）を動かすと、音の左右・前後・距離が変わります。</p>
      <p class="state" id="state">非XRプレビュー: ドラッグで視点回転 / VR開始でヘッドトラッキング定位</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import { createXRGate } from "../_shared/bangeo-xr.js";

    const stateEl = document.getElementById("state");

    // ---- scene ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0b16);
    scene.fog = new THREE.Fog(0x0b0b16, 6, 16);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 60);
    camera.position.set(0, 1.6, 0.001);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.6, -0.5);
    controls.enablePan = false;
    controls.update();

    scene.add(new THREE.HemisphereLight(0x8888ff, 0x223344, 1.2));
    const dir = new THREE.DirectionalLight(0xffffff, 1.4);
    dir.position.set(2, 5, 2);
    scene.add(dir);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(8, 48).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x151528, roughness: 0.9 }),
    );
    scene.add(floor);
    scene.add(new THREE.GridHelper(16, 32, 0x334155, 0x1e293b));

    // ---- audio sources ----
    const SOURCES = [
      { color: 0xfb7185, pos: [-2.0, 1.3, -2.0], freq: 220, name: "220Hz 左前" },
      { color: 0x34d399, pos: [2.0, 1.5, -1.2], freq: 330, name: "330Hz 右前" },
      { color: 0x60a5fa, pos: [0.0, 1.0, -3.2], freq: 440, name: "440Hz 正面奥" },
      { color: 0xf59e0b, pos: [1.2, 1.8, 2.2], freq: 550, name: "550Hz 右後ろ" },
    ];

    let audioCtx = null;
    const nodes = [];

    const sources = SOURCES.map((cfg) => {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 24, 24),
        new THREE.MeshStandardMaterial({
          color: cfg.color, emissive: cfg.color, emissiveIntensity: 0.5,
        }),
      );
      mesh.position.set(...cfg.pos);
      scene.add(mesh);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.22, 0.27, 32),
        new THREE.MeshBasicMaterial({
          color: cfg.color, side: THREE.DoubleSide, transparent: true, opacity: 0.6,
        }),
      );
      ring.position.copy(mesh.position);
      scene.add(ring);
      return { ...cfg, mesh, ring };
    });

    function startAudio() {
      if (audioCtx) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        return;
      }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const master = audioCtx.createGain();
      master.gain.value = 0.12;
      master.connect(audioCtx.destination);

      for (const src of sources) {
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = src.freq;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 1;
        const panner = audioCtx.createPanner();
        panner.panningModel = "HRTF";
        panner.distanceModel = "inverse";
        panner.refDistance = 1;
        panner.rolloffFactor = 1.2;
        panner.positionX.value = src.pos[0];
        panner.positionY.value = src.pos[1];
        panner.positionZ.value = src.pos[2];
        osc.connect(lfoGain).connect(panner).connect(master);
        osc.start();
        nodes.push({ panner, src });
      }
      gate.log("AudioContextを開始しました（ユーザー操作起点）。");
    }

    // クリック/タップでもオーディオ開始（非XRプレビュー用）
    renderer.domElement.addEventListener("pointerdown", startAudio, { once: false });

    // ---- listener 更新 ----
    const listenerPos = new THREE.Vector3();
    const listenerQuat = new THREE.Quaternion();
    const fwd = new THREE.Vector3();
    const up = new THREE.Vector3();

    function updateListener() {
      if (!audioCtx) return;
      const xrCam = renderer.xr.isPresenting
        ? renderer.xr.getCamera()
        : camera;
      xrCam.getWorldPosition(listenerPos);
      xrCam.getWorldQuaternion(listenerQuat);
      fwd.set(0, 0, -1).applyQuaternion(listenerQuat);
      up.set(0, 1, 0).applyQuaternion(listenerQuat);
      const listener = audioCtx.listener;
      if (listener.positionX) {
        const t = audioCtx.currentTime;
        listener.positionX.setTargetAtTime(listenerPos.x, t, 0.02);
        listener.positionY.setTargetAtTime(listenerPos.y, t, 0.02);
        listener.positionZ.setTargetAtTime(listenerPos.z, t, 0.02);
        listener.forwardX.setTargetAtTime(fwd.x, t, 0.02);
        listener.forwardY.setTargetAtTime(fwd.y, t, 0.02);
        listener.forwardZ.setTargetAtTime(fwd.z, t, 0.02);
        listener.upX.setTargetAtTime(up.x, t, 0.02);
        listener.upY.setTargetAtTime(up.y, t, 0.02);
        listener.upZ.setTargetAtTime(up.z, t, 0.02);
      } else {
        listener.setPosition(listenerPos.x, listenerPos.y, listenerPos.z);
        listener.setOrientation(fwd.x, fwd.y, fwd.z, up.x, up.y, up.z);
      }
    }

    // ---- gate ----
    const gate = createXRGate({
      title: "WebXR Audio Space",
      subtitle:
        "VR空間内の4つの音源で、頭の向き・距離による定位変化（Web Audio PannerNode / HRTF）を確認します。開始と同時に音が鳴ります。",
      mode: "immersive-vr",
      optionalFeatures: ["local-floor", "bounded-floor"],
      backHref: "/experiments/webxr-audio-space",
      deviceHint:
        "Meta Quest / PICO のブラウザでこのURLを開いてください。PCでもVRに入らず、ドラッグ操作＋イヤホンで定位を確認できます（背景をクリックで再生開始）。",
      async onSessionStarted(session) {
        startAudio(); // requestSessionと同じユーザー操作起点
        await renderer.xr.setSession(session);
        stateEl.textContent = "VRセッション中: 頭を動かして音の定位変化を確認";
      },
      onSessionEnded() {
        stateEl.textContent =
          "非XRプレビュー: ドラッグで視点回転 / VR開始でヘッドトラッキング定位";
      },
    });

    // ---- render loop ----
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      for (const src of sources) {
        const s = 1 + Math.sin(t * 3 + src.freq) * 0.08;
        src.mesh.scale.setScalar(s);
        src.ring.lookAt(
          renderer.xr.isPresenting
            ? renderer.xr.getCamera().position
            : camera.position,
        );
        src.ring.scale.setScalar(1 + Math.sin(t * 3 + src.freq) * 0.15);
      }
      if (!renderer.xr.isPresenting) controls.update();
      updateListener();
      renderer.render(scene, camera);
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
