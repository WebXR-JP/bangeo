<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOD System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>LOD System</h3>
        <div class="desc">距離に応じてメッシュを低/中/高詳細モデルへ差し替えるLOD管理。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        let lod;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000022);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 5); // Start further back

            // LOD
            lod = new THREE.LOD();
            
            // High detail
            const geoHigh = new THREE.IcosahedronGeometry(1, 5);
            const matHigh = new THREE.MeshStandardMaterial({ color: 0xff0000, wireframe: true });
            const meshHigh = new THREE.Mesh(geoHigh, matHigh);
            lod.addLevel(meshHigh, 0);
            
            // Med detail
            const geoMed = new THREE.IcosahedronGeometry(1, 2);
            const matMed = new THREE.MeshStandardMaterial({ color: 0x00ff00, wireframe: true });
            const meshMed = new THREE.Mesh(geoMed, matMed);
            lod.addLevel(meshMed, 5);
            
            // Low detail
            const geoLow = new THREE.IcosahedronGeometry(1, 0);
            const matLow = new THREE.MeshStandardMaterial({ color: 0x0000ff, wireframe: true });
            const meshLow = new THREE.Mesh(geoLow, matLow);
            lod.addLevel(meshLow, 10);
            
            lod.position.set(0, 1.6, -5);
            scene.add(lod);
            
            scene.add(new THREE.GridHelper(20, 20));
            scene.add(new THREE.HemisphereLight(0xffffff, 0x000000));

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));
            
            // Text info
            const info = document.createElement('div');
            info.style.position = 'absolute';
            info.style.top = '10px';
            info.style.color = 'white';
            info.innerText = 'Move closer/further to see LOD change (Red -> Green -> Blue)';
            container.appendChild(info);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() { renderer.setAnimationLoop(render); }

        function render() {
            // In XR, the camera moves. LOD updates automatically based on camera position.
            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
