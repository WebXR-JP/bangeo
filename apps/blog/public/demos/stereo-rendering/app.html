<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stereo Rendering</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Stereo Rendering</h3>
        <div class="desc">XRView（左/右）のビュー行列とビューポートを使ったステレオ描画パス。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        let leftObj, rightObj;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            scene.add(new THREE.GridHelper(10, 10));

            // Object visible only to left eye (Layer 1)
            const geo1 = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const mat1 = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            leftObj = new THREE.Mesh(geo1, mat1);
            leftObj.position.set(-0.5, 1.6, -2);
            leftObj.layers.set(1); // Left eye typically
            scene.add(leftObj);

            // Object visible only to right eye (Layer 2)
            const geo2 = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const mat2 = new THREE.MeshBasicMaterial({ color: 0x0000ff });
            rightObj = new THREE.Mesh(geo2, mat2);
            rightObj.position.set(0.5, 1.6, -2);
            rightObj.layers.set(2); // Right eye typically
            scene.add(rightObj);
            
            // Note: Three.js WebXRManager sets camera.layers to 1 for left, 2 for right automatically during render.

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            leftObj.rotation.y += 0.02;
            rightObj.rotation.y -= 0.02;
            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
