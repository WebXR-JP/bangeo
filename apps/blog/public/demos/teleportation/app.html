<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Teleportation</h3>
        <div class="desc">コントローラーで宙に弧線を投げ、getOffsetReferenceSpace()でビュー位置を移動させるテレポート。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/XRControllerModelFactory.js';

        // --- Demo Implementation ---
        
        // Simplified teleportation: Point at floor, click to move camera root.
        let camera, scene, renderer;
        let controller1, _controller2;
        let raycaster;
        let marker;
        let baseReferenceSpace;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);
            
            // Camera wrapper group if we were not using WebXR offset, 
            // but WebXR usually handles offset via referenceSpace.

            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            
            const grid = new THREE.GridHelper(10, 10);
            scene.add(grid);

            scene.add(new THREE.HemisphereLight(0x808080, 0x606060));

            // Marker
            marker = new THREE.Mesh(new THREE.CircleGeometry(0.25, 32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
            marker.visible = false;
            scene.add(marker);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            
            // Handle reference space
            renderer.xr.addEventListener('sessionstart', () => {
                baseReferenceSpace = renderer.xr.getReferenceSpace();
            });
            
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('select', onSelect);
            scene.add(controller1);

            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]));
            controller1.add(line);

            const controllerModelFactory = new XRControllerModelFactory();
            const grip1 = renderer.xr.getControllerGrip(0);
            grip1.add(controllerModelFactory.createControllerModel(grip1));
            scene.add(grip1);

            raycaster = new THREE.Raycaster();
            window.addEventListener('resize', onWindowResize);
        }
        
        function onSelect() {
            if (marker.visible) {
                // Teleport!
                const _offsetPosition = { x: -marker.position.x, y: -marker.position.y, z: -marker.position.z, w: 1 };
                const _offsetRotation = new THREE.Quaternion();
                
                // XRRigidTransform is needed for getOffsetReferenceSpace
                // Three.js doesn't expose it easily directly, but we can try to use setReferenceSpaceType or manual offset
                
                // Simpler Three.js way: Move a wrapper object? No, we should use XR reference space offset.
                // However, accessing the raw session is needed.
                
                const session = renderer.xr.getSession();
                if (baseReferenceSpace && session) {
                    const offset = new XRRigidTransform({
                        x: marker.position.x,
                        y: 0,
                        z: marker.position.z
                    }, { x: 0, y: 0, z: 0, w: 1 });
                    
                    const newSpace = baseReferenceSpace.getOffsetReferenceSpace(offset);
                    renderer.xr.setReferenceSpace(newSpace);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() { renderer.setAnimationLoop(render); }

        function render() {
            // Raycast floor
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller1.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller1.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            
            const intersects = raycaster.intersectObjects(scene.children);
            let hit = null;
            for(let i=0; i<intersects.length; i++) {
                if (intersects[i].object.geometry && intersects[i].object.geometry.type === 'PlaneGeometry') {
                    hit = intersects[i];
                    break;
                }
            }
            
            if (hit) {
                marker.visible = true;
                marker.position.copy(hit.point);
            } else {
                marker.visible = false;
            }

            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
