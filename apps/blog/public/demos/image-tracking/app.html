<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Image Tracking</title>
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<script src="/demos/xr-standalone/xrextras.js"></script>
	<script async src="/demos/xr-standalone/xr.js"></script>
	<style>
		body { margin: 0; overflow: hidden; background: #000; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
		#info {
			position: absolute; top: 10px; width: 100%; text-align: center; color: white;
			pointer-events: none; z-index: 100; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
		}
		#info a { color: #f4a83a; pointer-events: auto; }
		.desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
	</style>
	<script>
		// イメージターゲット検出時のイベントハンドラ
		AFRAME.registerComponent("target-found-handler", {
			init() {
				const el = this.el;
				el.addEventListener("model-loaded", () => {
					console.log("ターゲット検出・モデル表示");
				});
			},
		});
	</script>
</head>
<body>
	<div id="info">
		<h3>Image Tracking</h3>
		<div class="desc">
			8th Wall + A-Frame によるイメージターゲット検出。登録した画像をカメラに向けると3Dコンテンツが表示されます。
		</div>
		<div style="margin-top: 10px;"><a href="/">← デモ一覧</a></div>
	</div>

	<a-scene
		xrweb="allowedDevices: any; disableWorldTracking: true"
		xrextras-loading
		xrextras-runtime-error
		renderer="colorManagement: true"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-camera position="0 2 6"></a-camera>

		<!-- カメラ映像上に3Dオーバーレイ -->
		<!-- 回転キューブ -->
		<a-box
			position="0 1 0"
			scale="0.6 0.6 0.6"
			material="color: #2080ff; metalness: 0.6; roughness: 0.3"
			animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true">
		</a-box>

		<!-- 軌道球体 -->
		<a-sphere
			position="1.2 0.6 0"
			radius="0.25"
			material="color: #ff4466; metalness: 0.4"
			animation="property: position; from: 1.2 0.6 0; to: -1.2 0.6 0; dur: 2500; easing: easeInOutSine; loop: true; dir: alternate">
		</a-sphere>

		<!-- シリンダー -->
		<a-cylinder
			position="-0.8 0.4 0.5"
			radius="0.2"
			height="0.8"
			material="color: #44dd66; metalness: 0.3"
			animation="property: rotation; to: 0 -360 0; dur: 6000; easing: linear; loop: true">
		</a-cylinder>

		<!-- コーン -->
		<a-cone
			position="0.8 0.4 -0.5"
			radius-bottom="0.2"
			height="0.6"
			material="color: #ffaa44; metalness: 0.4"
			animation="property: rotation; to: 360 0 0; dur: 5000; easing: linear; loop: true">
		</a-cone>

		<!-- 照明 -->
		<a-light type="ambient" color="#666"></a-light>
		<a-light type="directional" position="2 4 3" intensity="1"></a-light>

		<!-- 地面グリッド -->
		<a-plane
			position="0 0 0"
			rotation="-90 0 0"
			width="4"
			height="4"
			material="color: #333333; opacity: 0.3; transparent: true">
		</a-plane>
	</a-scene>
</body>
</html>
