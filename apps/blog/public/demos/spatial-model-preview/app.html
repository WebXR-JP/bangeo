<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページ内3Dモデルを空間表示へつなぐ実験</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #64748b;
      --line: #e5edf7;
      --rose: #e11d48;
      --blue: #2797d8;
      --cyan: #17c8df;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      background: linear-gradient(135deg, #fff7f9, #ffffff 45%, #eef8ff);
      color: var(--ink);
    }
    .shell {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
    }
    .panel,
    .stage {
      border: 1px solid rgba(39, 151, 216, 0.16);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    .panel {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    h1 { margin: 0; font-size: 18px; line-height: 1.35; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; font-weight: 700; }
    .seg {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: #334155;
      min-height: 38px;
      padding: 8px 11px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      text-align: left;
    }
    button[aria-pressed="true"] {
      background: #fff1f2;
      border-color: rgba(225, 29, 72, 0.36);
      color: var(--rose);
    }
    .metric {
      display: grid;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #f8fbff;
      color: #475569;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 750;
    }
    .metric strong { color: var(--ink); }
    .stage { position: relative; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hint {
      position: absolute;
      left: 14px;
      bottom: 14px;
      border: 1px solid rgba(39, 151, 216, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #2563a8;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }
    @media (max-width: 780px) {
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        padding: 10px;
      }
      .panel { max-height: 40vh; overflow: auto; }
      .seg { grid-template-columns: repeat(3, 1fr); }
      button { text-align: center; padding: 8px 7px; }
      h1 { font-size: 16px; }
      p { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="panel">
      <div>
        <h1>ページ内3Dモデルを空間表示へつなぐ実験</h1>
        <p>HTMLのmodel要素、代替ライブラリ、静止画表示を同じカード上で切り替えて、ページ内3Dの入口を確認します。</p>
      </div>
      <div class="seg" role="group" aria-label="表示方法">
        <button id="native" type="button" aria-pressed="true">ブラウザ標準</button>
        <button id="polyfill" type="button" aria-pressed="false">代替ライブラリ</button>
        <button id="fallbackMode" type="button" aria-pressed="false">静止画表示</button>
      </div>
      <div class="metric" id="metric">
        <strong>判定中</strong>
        <span>HTMLModelElement の検出結果を確認しています。</span>
      </div>
      <p>プレビュー部分をドラッグすると、orbit操作の考え方を確認できます。</p>
    </aside>
    <section class="stage" aria-label="ページ内3Dモデルのプレビュー">
      <canvas id="stage"></canvas>
      <div class="hint" id="hint">ドラッグで回転</div>
    </section>
  </div>
  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const metric = document.getElementById("metric");
    const buttons = {
      native: document.getElementById("native"),
      polyfill: document.getElementById("polyfill"),
      fallback: document.getElementById("fallbackMode"),
    };
    let mode = "native";
    let supported = "HTMLModelElement" in window;
    let angle = -0.42;
    let dragging = false;
    let lastX = 0;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function setMode(next) {
      mode = next;
      buttons.native.setAttribute("aria-pressed", String(mode === "native"));
      buttons.polyfill.setAttribute("aria-pressed", String(mode === "polyfill"));
      buttons.fallback.setAttribute("aria-pressed", String(mode === "fallback"));
      const title = mode === "native"
        ? supported ? "ブラウザ標準: 対応あり" : "ブラウザ標準: 代替表示が必要"
        : mode === "polyfill"
          ? "代替ライブラリ経路"
          : "静止画表示";
      const body = mode === "native"
        ? "対応SafariではHTML要素として3Dモデルを扱い、非対応環境では代替表示へ落とします。"
        : mode === "polyfill"
          ? "非対応ブラウザではmodel-viewer等に近いJavaScript経路で補います。"
          : "静止画でも商品や教材の意味が伝わるようにします。";
      metric.innerHTML = `<strong>${title}</strong><span>${body}</span>`;
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawBrowser(x, y, w, h) {
      ctx.fillStyle = "rgba(255,255,255,0.96)";
      ctx.strokeStyle = "#b8d7f3";
      ctx.lineWidth = 2;
      roundedRect(x, y, w, h, 18);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#f06292";
      ctx.beginPath();
      ctx.arc(x + 24, y + 24, 6, 0, Math.PI * 2);
      ctx.arc(x + 45, y + 24, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#8bd0ef";
      ctx.arc(x + 66, y + 24, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#e5edf7";
      ctx.beginPath();
      ctx.moveTo(x, y + 48);
      ctx.lineTo(x + w, y + 48);
      ctx.stroke();
    }

    function drawFallbackCard(x, y, w, h) {
      ctx.save();
      ctx.globalAlpha = mode === "fallback" ? 1 : 0.38;
      ctx.fillStyle = "#f8fbff";
      ctx.strokeStyle = "#d4e8f8";
      ctx.lineWidth = 2;
      roundedRect(x, y, w, h, 16);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#b7d8ef";
      ctx.beginPath();
      ctx.moveTo(x + w * 0.18, y + h * 0.72);
      ctx.lineTo(x + w * 0.42, y + h * 0.43);
      ctx.lineTo(x + w * 0.62, y + h * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#8fc8eb";
      ctx.beginPath();
      ctx.moveTo(x + w * 0.42, y + h * 0.72);
      ctx.lineTo(x + w * 0.68, y + h * 0.36);
      ctx.lineTo(x + w * 0.9, y + h * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#f06292";
      ctx.beginPath();
      ctx.arc(x + w * 0.78, y + h * 0.26, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawModel(cx, cy, size, time) {
      ctx.save();
      const cos = Math.cos(angle);
      const sx = 0.78 + Math.abs(cos) * 0.26;
      ctx.translate(cx, cy);
      ctx.scale(sx, 1);
      const active = mode !== "fallback";
      ctx.globalAlpha = active ? 1 : 0.28;

      ctx.strokeStyle = active ? "#2797d8" : "#9fb6c9";
      ctx.fillStyle = active ? "#d8f1ff" : "#eef2f6";
      ctx.lineWidth = 3;
      roundedRect(-size * 0.38, -size * 0.46, size * 0.76, size * 0.52, 16);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = active ? "#8ed3f2" : "#d8e2ea";
      roundedRect(-size * 0.44, -size * 0.03, size * 0.88, size * 0.2, 14);
      ctx.fill();
      ctx.stroke();
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-size * 0.28, size * 0.14);
      ctx.lineTo(-size * 0.34, size * 0.58);
      ctx.moveTo(size * 0.28, size * 0.14);
      ctx.lineTo(size * 0.34, size * 0.58);
      ctx.stroke();

      ctx.restore();

      if (mode !== "fallback") {
        ctx.save();
        ctx.translate(cx, cy - size * 0.04);
        ctx.rotate(Math.sin(time * 0.001) * 0.03);
        ctx.strokeStyle = mode === "native" ? "#e11d48" : "#17c8df";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.86, size * 0.28, angle * 0.15, 0, Math.PI * 2);
        ctx.stroke();
        for (const offset of [-0.42, 0.08, 0.55]) {
          const px = Math.cos(angle + offset) * size * 0.86;
          const py = Math.sin(angle + offset) * size * 0.28;
          ctx.fillStyle = offset === 0.08 ? "#2797d8" : "#e11d48";
          ctx.beginPath();
          ctx.arc(px, py, 7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function draw(time) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, "#fff7f9");
      bg.addColorStop(0.6, "#ffffff");
      bg.addColorStop(1, "#eef8ff");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      drawFallbackCard(w * 0.59, h * 0.2, w * 0.25, h * 0.36);
      drawBrowser(w * 0.13, h * 0.12, w * 0.58, h * 0.68);

      ctx.fillStyle = "#f8fbff";
      ctx.strokeStyle = "#d6e8f5";
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        roundedRect(w * 0.17, h * (0.26 + i * 0.11), 42, 42, 12);
        ctx.fill();
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(225, 29, 72, 0.1)";
      ctx.beginPath();
      ctx.ellipse(w * 0.44, h * 0.65, w * 0.18, h * 0.06, 0, 0, Math.PI * 2);
      ctx.fill();
      drawModel(w * 0.44, h * 0.5, Math.min(w, h) * 0.25, time);

      ctx.fillStyle = mode === "native" ? "#e11d48" : mode === "polyfill" ? "#17c8df" : "#64748b";
      ctx.beginPath();
      ctx.arc(w * 0.72, h * 0.72, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "900 18px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(mode === "fallback" ? "画像" : "3D", w * 0.72, h * 0.73);
      ctx.textAlign = "start";

      if (!dragging) angle += 0.003;
      requestAnimationFrame(draw);
    }

    for (const [key, button] of Object.entries(buttons)) {
      button.addEventListener("click", () => setMode(key));
    }
    canvas.addEventListener("pointerdown", (event) => {
      dragging = true;
      lastX = event.clientX;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      angle += (event.clientX - lastX) * 0.01;
      lastX = event.clientX;
    });
    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("pointercancel", () => { dragging = false; });
    window.addEventListener("resize", resize);
    resize();
    setMode("native");
    requestAnimationFrame(draw);
  </script>
</body>
</html>
