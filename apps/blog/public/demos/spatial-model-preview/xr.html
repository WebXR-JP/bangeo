<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページ内3DモデルをWebXRで見る</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      background: linear-gradient(135deg, #fff7f9, #eef8ff);
      color: #111827;
    }
    canvas { display: block; }
    .hud {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 10;
      pointer-events: none;
    }
    .card {
      width: min(560px, 100%);
      border: 1px solid rgba(39, 151, 216, 0.18);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 42px rgba(15, 23, 42, 0.12);
      padding: 12px 14px;
    }
    h1 { margin: 0 0 5px; font-size: 15px; line-height: 1.4; letter-spacing: 0; }
    p { margin: 0; color: #64748b; font-size: 12px; line-height: 1.6; font-weight: 700; }
    .chip {
      display: inline-flex;
      margin-top: 8px;
      border-radius: 999px;
      border: 1px solid #d8eafb;
      background: #f8fbff;
      color: #2563a8;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="hud">
    <section class="card">
      <h1>WebXRで空間内の3Dモデルカードを見る</h1>
      <p>ページ内3Dモデルを、空間内のカードとして置いた時の大きさと距離感を確認します。</p>
      <span class="chip" id="xrState">WebXR確認中</span>
    </section>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { VRButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js";

    const xrState = document.getElementById("xrState");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fbff);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 40);
    camera.position.set(0, 1.55, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    scene.add(new THREE.HemisphereLight(0xffffff, 0xb8d9ff, 2));
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(2, 3, 3);
    scene.add(light);

    const card = new THREE.Group();
    card.position.set(0, 1.35, -1.25);
    scene.add(card);

    const panel = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 0.86, 0.035),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.45 }),
    );
    card.add(panel);

    const chair = new THREE.Group();
    chair.position.set(0, -0.03, 0.12);
    card.add(chair);
    const seatMaterial = new THREE.MeshStandardMaterial({ color: 0x8bd0ef, roughness: 0.38 });
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.08, 0.38), seatMaterial);
    chair.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.46, 0.08), seatMaterial);
    back.position.set(0, 0.25, -0.15);
    chair.add(back);
    for (const x of [-0.16, 0.16]) {
      for (const z of [-0.12, 0.12]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.36, 12), seatMaterial);
        leg.position.set(x, -0.22, z);
        chair.add(leg);
      }
    }

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.55, 0.012, 12, 96),
      new THREE.MeshStandardMaterial({ color: 0xe11d48, emissive: 0x26050d }),
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.z = 0.12;
    card.add(ring);

    const fallback = new THREE.Mesh(
      new THREE.BoxGeometry(0.58, 0.4, 0.025),
      new THREE.MeshStandardMaterial({ color: 0xdbeafe, roughness: 0.5 }),
    );
    fallback.position.set(0.86, 0.05, -0.16);
    fallback.rotation.y = -0.25;
    card.add(fallback);

    const floor = new THREE.GridHelper(4, 16, 0x8bc7eb, 0xd8eafb);
    scene.add(floor);

    xrState.textContent = navigator.xr ? "WebXRあり" : "WebXRなし";
    renderer.xr.addEventListener("sessionstart", () => {
      xrState.textContent = "WebXRセッション中";
    });
    renderer.xr.addEventListener("sessionend", () => {
      xrState.textContent = "WebXRセッション終了";
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop((time) => {
      chair.rotation.y = time * 0.001;
      ring.rotation.z = time * 0.0008;
      card.rotation.y = Math.sin(time * 0.0006) * 0.12;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
