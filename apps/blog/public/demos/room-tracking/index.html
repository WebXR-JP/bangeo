<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR Bounded Floor Viewer | BANGEO WebXR Lab</title>
  <link rel="icon" type="image/png" href="https://www.bangeo.net/favicon.png">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0b16; }
    canvas { display: block; }
    .hud {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      pointer-events: none;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    }
    .hud .card {
      width: min(480px, 100%);
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px; padding: 12px 14px; color: #e5e7eb;
    }
    .hud h1 { margin: 0 0 4px; font-size: 14px; }
    .hud p { margin: 0; font-size: 11.5px; line-height: 1.6; color: #9ca3af; }
    .hud .state { margin-top: 6px; font-size: 11px; font-weight: 900; color: #fda4af; white-space: pre-line; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="card">
      <h1>WebXR Bounded Floor Viewer</h1>
      <p>bounded-floor の boundsGeometry（プレイエリア境界）を床に描画します。bounded-floor が取れない場合は local-floor にフォールバックし、その事実を明示します。</p>
      <p class="state" id="state">VR開始前</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { createXRGate } from "../_shared/bangeo-xr.js";

    const stateEl = document.getElementById("state");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0b16);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 40);
    camera.position.set(0, 1.6, 2.5);

    scene.add(new THREE.HemisphereLight(0x8888ff, 0x223344, 1.4));

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 床グリッド（local-floor基準の視覚アンカー）
    scene.add(new THREE.GridHelper(8, 32, 0x475569, 0x1e293b));
    const originMarker = new THREE.Mesh(
      new THREE.RingGeometry(0.1, 0.14, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x60a5fa }),
    );
    originMarker.position.y = 0.005;
    scene.add(originMarker);

    // 境界表示用グループ
    const boundsGroup = new THREE.Group();
    scene.add(boundsGroup);

    function clearBounds() {
      while (boundsGroup.children.length) {
        boundsGroup.remove(boundsGroup.children[0]);
      }
    }

    function drawBounds(boundsGeometry) {
      clearBounds();
      if (!boundsGeometry || boundsGeometry.length === 0) return 0;

      const points = boundsGeometry.map(
        (p) => new THREE.Vector3(p.x, 0.01, p.z),
      );
      points.push(points[0].clone()); // ループを閉じる

      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({ color: 0xfb7185, linewidth: 2 }),
      );
      boundsGroup.add(line);

      // 頂点マーカーと、境界に沿った薄い壁
      for (let i = 0; i < boundsGeometry.length; i++) {
        const p = boundsGeometry[i];
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8).translate(0, 0.2, 0),
          new THREE.MeshBasicMaterial({ color: 0xfda4af }),
        );
        post.position.set(p.x, 0, p.z);
        boundsGroup.add(post);
      }

      const wallShape = points.slice(0, -1);
      for (let i = 0; i < wallShape.length; i++) {
        const a = wallShape[i];
        const b = wallShape[(i + 1) % wallShape.length];
        const len = a.distanceTo(b);
        const wall = new THREE.Mesh(
          new THREE.PlaneGeometry(len, 0.4),
          new THREE.MeshBasicMaterial({
            color: 0xfb7185, transparent: true, opacity: 0.12, side: THREE.DoubleSide,
          }),
        );
        wall.position.copy(a).add(b).multiplyScalar(0.5);
        wall.position.y = 0.2;
        wall.lookAt(new THREE.Vector3(b.x, 0.2, b.z));
        wall.rotateY(Math.PI / 2);
        boundsGroup.add(wall);
      }
      return boundsGeometry.length;
    }

    let activeSpaceType = null;

    async function setupReferenceSpace(session) {
      // 1. bounded-floor を試す
      try {
        const bounded = await session.requestReferenceSpace("bounded-floor");
        activeSpaceType = "bounded-floor";
        renderer.xr.setReferenceSpace(bounded);

        const apply = () => {
          const count = drawBounds(bounded.boundsGeometry);
          stateEl.textContent =
            `reference space: bounded-floor\n境界頂点数: ${count}` +
            (count === 0 ? "（boundsGeometryが空です。プレイエリアを設定してください）" : "");
        };
        apply();
        bounded.addEventListener("reset", () => {
          gate.log("bounded-floorがreset（再センタリング等）されました。再描画します。");
          apply();
        });
        return;
      } catch (err) {
        gate.log(
          `bounded-floorは取得できませんでした（${err?.name ?? "Error"}）。local-floorにフォールバックします。`,
        );
      }

      // 2. local-floor フォールバック
      try {
        const local = await session.requestReferenceSpace("local-floor");
        activeSpaceType = "local-floor";
        renderer.xr.setReferenceSpace(local);
        clearBounds();
        stateEl.textContent =
          "reference space: local-floor（フォールバック）\n境界は取得できません。床原点マーカー（青リング）のずれのみ確認できます。";
      } catch (err) {
        activeSpaceType = null;
        gate.error(
          `local-floorも取得できませんでした: ${err?.message ?? err}`,
        );
        stateEl.textContent = "床基準のreference spaceを取得できませんでした";
      }
    }

    const gate = createXRGate({
      title: "WebXR Bounded Floor Viewer",
      subtitle:
        "プレイエリア境界（boundsGeometry）の形状・頂点数・床基準のずれを実機で確認します。事前にヘッドセット側でプレイエリア（静止／ルームスケール）を設定してください。",
      mode: "immersive-vr",
      // bounded-floorは必須にせず、セッション内でフォールバックを明示する
      optionalFeatures: ["bounded-floor", "local-floor"],
      backHref: "/experiments/room-scale-bounds-viewer",
      deviceHint:
        "Meta Quest（Quest Browser 146以降推奨）または PICO のブラウザでこのURLを開いてください。境界の評価には実機とプレイエリア設定が必須です。",
      async onSessionStarted(session) {
        await renderer.xr.setSession(session);
        await setupReferenceSpace(session);
      },
      onSessionEnded() {
        clearBounds();
        stateEl.textContent = "VR終了。もう一度開始できます";
      },
    });

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
