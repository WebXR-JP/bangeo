<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Features</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Session Features</h3>
        <div class="desc">XRSessionInitでrequired/optionalFeaturesを指定し、利用可否を検査するパターン。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x002200);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            const grid = new THREE.GridHelper(10, 10);
            scene.add(grid);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Requesting many features to test support
            const sessionInit = {
                requiredFeatures: ['local-floor'],
                optionalFeatures: ['bounded-floor', 'hand-tracking', 'layers']
            };
            
            document.body.appendChild(VRButton.createButton(renderer, sessionInit));

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
