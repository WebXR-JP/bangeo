<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Advanced</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Hand Tracking Advanced</h3>
        <div class="desc">Hand Inputの関節座標からジェスチャー（ピンチ/グラブ）を検出し、UI操作に紐づけるデモ。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        let _hand1, _hand2;

        
        import { XRHandModelFactory } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/XRHandModelFactory.js';

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x444444);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            // Objects to interact with
            const boxGeometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const boxMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const box = new THREE.Mesh(boxGeometry, boxMaterial);
            box.position.set(0, 1, -0.5);
            scene.add(box);

            scene.add(new THREE.HemisphereLight(0x808080, 0x606060));
            const light = new THREE.DirectionalLight(0xffffff);
            light.position.set(0, 6, 0);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            const handModelFactory = new XRHandModelFactory();

            function createHand(id) {
                const hand = renderer.xr.getHand(id);
                hand.add(handModelFactory.createHandModel(hand, "spheres"));
                
                // Detect pinch
                hand.addEventListener('pinchend', () => {
                    box.material.color.setHex(Math.random() * 0xffffff);
                    // Haptics if available (proposal)
                    // if (hand.gamepad && hand.gamepad.hapticActuators && hand.gamepad.hapticActuators.length > 0) {
                    //     hand.gamepad.hapticActuators[0].pulse(1.0, 100);
                    // }
                });
                
                scene.add(hand);
                return hand;
            }

            _hand1 = createHand(0);
            _hand2 = createHand(1);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
