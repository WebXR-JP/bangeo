<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR Hit Test | BANGEO WebXR Lab</title>
  <link rel="icon" type="image/png" href="https://www.bangeo.net/favicon.png">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0b16; }
    canvas { display: block; }
    .hud {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      pointer-events: none;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    }
    .hud .card {
      width: min(460px, 100%);
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px; padding: 12px 14px; color: #e5e7eb;
    }
    .hud h1 { margin: 0 0 4px; font-size: 14px; }
    .hud p { margin: 0; font-size: 11.5px; line-height: 1.6; color: #9ca3af; }
    .hud .state { margin-top: 6px; font-size: 11px; font-weight: 900; color: #fda4af; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="card">
      <h1>WebXR Hit Test</h1>
      <p>視線（viewer ray）で現実の床・机・壁を検出し、リング（reticle）が面に吸着します。トリガー / タップでその位置に円柱を置きます。</p>
      <p class="state" id="state">AR開始前</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { createXRGate } from "../_shared/bangeo-xr.js";

    const stateEl = document.getElementById("state");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);

    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
    light.position.set(0.5, 1, 0.25);
    scene.add(light);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.13, 0.18, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xfb7185 }),
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let placedCount = 0;

    const controller = renderer.xr.getController(0);
    controller.addEventListener("select", () => {
      if (!reticle.visible) return;
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, 0.16, 32).translate(0, 0.08, 0),
        new THREE.MeshPhongMaterial({
          color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6),
        }),
      );
      reticle.matrix.decompose(mesh.position, mesh.quaternion, mesh.scale);
      scene.add(mesh);
      placedCount += 1;
      stateEl.textContent = `配置数: ${placedCount} / reticle: 検出中`;
    });
    scene.add(controller);

    const gate = createXRGate({
      title: "WebXR Hit Test",
      subtitle:
        "immersive-ar + hit-test で、現実空間の面検出とオブジェクト配置を確認します。明るく、模様のある床や机の前で試してください。",
      mode: "immersive-ar",
      requiredFeatures: ["hit-test"],
      optionalFeatures: ["local-floor", "dom-overlay"],
      backHref: "/experiments/hit-test-advanced",
      deviceHint:
        "パススルーAR対応のヘッドセット（Meta Quest 3 / 3S / Pro など）またはARCore対応AndroidのChromeで、このURLを開いてください。PICOはブラウザのimmersive-ar対応状況に依存します。",
      async onSessionStarted(session) {
        hitTestSource = null;
        hitTestSourceRequested = false;
        placedCount = 0;
        await renderer.xr.setSession(session);
        stateEl.textContent = "ARセッション中: 床や机にゆっくり視線を向けてください";
      },
      onSessionEnded() {
        hitTestSource = null;
        hitTestSourceRequested = false;
        stateEl.textContent = "AR終了。もう一度開始できます";
        // 配置物をリセット
        const toRemove = scene.children.filter(
          (c) => c.geometry?.type === "CylinderGeometry",
        );
        for (const m of toRemove) scene.remove(m);
      },
    });

    renderer.setAnimationLoop((_time, frame) => {
      if (frame) {
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          hitTestSourceRequested = true;
          session
            .requestReferenceSpace("viewer")
            .then((viewerSpace) =>
              session.requestHitTestSource({ space: viewerSpace }),
            )
            .then((source) => {
              hitTestSource = source;
              gate.log("Hit Test Sourceを取得しました。");
            })
            .catch((err) => {
              gate.error(`Hit Test Source取得に失敗: ${err?.message ?? err}`);
              stateEl.textContent = "hit-testを取得できませんでした";
            });
        }

        if (hitTestSource) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const results = frame.getHitTestResults(hitTestSource);
          if (results.length > 0) {
            const pose = results[0].getPose(referenceSpace);
            if (pose) {
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
            }
          } else {
            reticle.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
