<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPUからWebGLへ切り替える実験</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #64748b;
      --line: #e5edf7;
      --rose: #e11d48;
      --blue: #2797d8;
      --cyan: #17c8df;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      background: #fbfdff;
      color: var(--ink);
    }
    .shell {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 14px;
      gap: 12px;
    }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 14px 42px rgba(15, 23, 42, 0.08);
      padding: 12px;
    }
    h1 { margin: 0; font-size: 18px; line-height: 1.35; letter-spacing: 0; }
    .sub { margin: 3px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; font-weight: 700; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: #334155;
      min-height: 38px;
      padding: 8px 11px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      background: #fff1f2;
      border-color: rgba(225, 29, 72, 0.36);
      color: var(--rose);
    }
    .stage {
      min-height: 0;
      border: 1px solid rgba(39, 151, 216, 0.16);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #ffffff, #f4fbff);
      box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .status {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 8px;
    }
    .chip {
      border: 1px solid rgba(39, 151, 216, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      color: #2563a8;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }
    .chip.warn { color: #be123c; border-color: rgba(225, 29, 72, 0.22); }
    @media (max-width: 720px) {
      .topbar { grid-template-columns: 1fr; }
      .buttons { justify-content: stretch; }
      .buttons button { flex: 1; }
      .sub { display: none; }
      .status { grid-template-columns: 1fr; right: 14px; }
      h1 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1>WebGPUからWebGLへ切り替える実験</h1>
        <p class="sub">WebGPUが使えない端末でも、WebGL相当の経路へ切り替える判断を可視化します。</p>
      </div>
      <div class="buttons" role="group" aria-label="render mode">
        <button id="auto" type="button" aria-pressed="true">自動判定</button>
        <button id="gpu" type="button" aria-pressed="false">WebGPU優先</button>
        <button id="gl" type="button" aria-pressed="false">WebGL固定</button>
      </div>
    </header>
    <section class="stage" aria-label="描画経路の切り替えプレビュー">
      <canvas id="stage"></canvas>
      <div class="status">
        <span class="chip" id="api">GPU確認中</span>
        <span class="chip" id="path">描画経路: 自動判定</span>
        <span class="chip" id="fallback">切り替え準備中</span>
      </div>
    </section>
  </div>
  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const buttons = {
      auto: document.getElementById("auto"),
      gpu: document.getElementById("gpu"),
      gl: document.getElementById("gl"),
    };
    const api = document.getElementById("api");
    const path = document.getElementById("path");
    const fallback = document.getElementById("fallback");
    let mode = "auto";
    let webgpuAvailable = false;
    let adapterName = "";
    const frameHistory = new Array(72).fill(12);
    let lastTime = performance.now();

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    async function detectWebGPU() {
      if (!navigator.gpu) {
        api.textContent = "WebGPU対応なし";
        api.classList.add("warn");
        return;
      }
      try {
        const adapter = await navigator.gpu.requestAdapter();
        webgpuAvailable = !!adapter;
        adapterName = adapter?.info?.architecture || "";
        api.textContent = webgpuAvailable ? "WebGPU対応あり" : "WebGPU対応なし";
        api.classList.toggle("warn", !webgpuAvailable);
      } catch (_error) {
        api.textContent = "WebGPU確認に失敗";
        api.classList.add("warn");
      }
    }

    function activePath() {
      if (mode === "gl") return "webgl";
      if (mode === "gpu") return webgpuAvailable ? "webgpu" : "webgl-fallback";
      return webgpuAvailable ? "webgpu" : "webgl-fallback";
    }

    function setMode(next) {
      mode = next;
      for (const [key, button] of Object.entries(buttons)) {
        button.setAttribute("aria-pressed", String(key === mode));
      }
      updateLabels();
    }

    function updateLabels() {
      const current = activePath();
      path.textContent = current === "webgpu" ? "描画経路: WebGPU" : current === "webgl" ? "描画経路: WebGL固定" : "描画経路: WebGLへ切り替え";
      fallback.textContent = current === "webgpu" ? "WebGL代替も準備済み" : "WebGL代替表示中";
      fallback.classList.toggle("warn", current !== "webgpu");
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawPanel(x, y, w, h, color, title, detail, active) {
      ctx.save();
      ctx.globalAlpha = active ? 1 : 0.44;
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = color;
      ctx.lineWidth = active ? 3 : 1.5;
      roundedRect(x, y, w, h, 18);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x + 22, y + 22, 5, 0, Math.PI * 2);
      ctx.arc(x + 40, y + 22, 5, 0, Math.PI * 2);
      ctx.arc(x + 58, y + 22, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#111827";
      ctx.font = "900 14px system-ui";
      ctx.fillText(title, x + 24, y + h - 34);
      ctx.fillStyle = "#64748b";
      ctx.font = "800 11px system-ui";
      ctx.fillText(detail, x + 24, y + h - 16);
      ctx.restore();
    }

    function drawCube(cx, cy, size, color, t, complex) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.sin(t * 0.0012) * 0.14);
      const pulse = Math.sin(t * 0.003) * size * 0.08;
      const s = size + pulse;
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.86;
      roundedRect(-s * 0.45, -s * 0.36, s * 0.9, s * 0.72, 10);
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha = 0.38;
      ctx.beginPath();
      ctx.moveTo(-s * 0.45, -s * 0.36);
      ctx.lineTo(-s * 0.16, -s * 0.68);
      ctx.lineTo(s * 0.74, -s * 0.68);
      ctx.lineTo(s * 0.45, -s * 0.36);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      if (complex) {
        ctx.globalAlpha = 0.68;
        for (let i = 0; i < 18; i++) {
          const a = t * 0.001 + i * 0.7;
          const r = s * (0.66 + (i % 3) * 0.12);
          ctx.fillStyle = i % 2 ? "#e11d48" : "#17c8df";
          ctx.beginPath();
          ctx.arc(Math.cos(a) * r, Math.sin(a * 1.3) * r * 0.45, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawFrameBars(w, h, current, t) {
      const baseX = w * 0.13;
      const baseY = h * 0.84;
      const barW = (w * 0.74) / frameHistory.length;
      frameHistory.shift();
      const simulated = current === "webgpu"
        ? 8 + Math.sin(t * 0.012) * 2 + Math.random() * 1.4
        : 15 + Math.sin(t * 0.01) * 4 + Math.random() * 5;
      frameHistory.push(simulated);
      for (let i = 0; i < frameHistory.length; i++) {
        const v = frameHistory[i];
        const bh = Math.min(58, v * 2.4);
        ctx.fillStyle = v < 13 ? "#17c8df" : "#e11d48";
        ctx.globalAlpha = 0.28 + i / frameHistory.length * 0.58;
        roundedRect(baseX + i * barW, baseY - bh, Math.max(2, barW - 2), bh, 3);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#64748b";
      ctx.font = "800 11px system-ui";
      ctx.fillText("1フレームの目安", baseX, baseY + 20);
    }

    function draw(time) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const dt = time - lastTime;
      lastTime = time;
      const current = activePath();
      updateLabels();

      ctx.clearRect(0, 0, w, h);
      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, "#fff7f9");
      bg.addColorStop(0.52, "#ffffff");
      bg.addColorStop(1, "#eef8ff");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      const leftActive = current === "webgpu";
      const rightActive = current !== "webgpu";
      drawPanel(w * 0.07, h * 0.11, w * 0.38, h * 0.54, "#17c8df", "WebGPU経路", adapterName ? `実行先: ${adapterName}` : "新しいGPU経路", leftActive);
      drawPanel(w * 0.55, h * 0.11, w * 0.38, h * 0.54, "#e11d48", "WebGL代替", "広く動く経路", rightActive);

      drawCube(w * 0.26, h * 0.36, Math.min(w, h) * 0.14, "#17c8df", time, true);
      drawCube(w * 0.74, h * 0.36, Math.min(w, h) * 0.13, "#8fb7dc", time * 0.86, false);

      ctx.strokeStyle = current === "webgpu" ? "#17c8df" : "#e11d48";
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(w * 0.45, h * 0.39);
      ctx.lineTo(w * 0.55, h * 0.39);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = current === "webgpu" ? "#17c8df" : "#e11d48";
      ctx.beginPath();
      ctx.arc(w * 0.5, h * 0.39, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "900 18px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(current === "webgpu" ? "GPU" : "GL", w * 0.5, h * 0.397);
      ctx.textAlign = "start";

      drawFrameBars(w, h, current, time);
      ctx.fillStyle = "#64748b";
      ctx.font = "800 11px system-ui";
      ctx.fillText(`直近 ${Math.round(dt)}ms`, w * 0.74, h * 0.84 + 20);

      requestAnimationFrame(draw);
    }

    buttons.auto.addEventListener("click", () => setMode("auto"));
    buttons.gpu.addEventListener("click", () => setMode("gpu"));
    buttons.gl.addEventListener("click", () => setMode("gl"));
    window.addEventListener("resize", resize);
    resize();
    detectWebGPU().then(updateLabels);
    requestAnimationFrame(draw);
  </script>
</body>
</html>
