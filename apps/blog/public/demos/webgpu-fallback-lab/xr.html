<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU対応確認をWebXRで見る</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      background: linear-gradient(135deg, #fff7f9, #eef8ff);
      color: #111827;
    }
    canvas { display: block; }
    .hud {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 10;
      pointer-events: none;
    }
    .card {
      width: min(560px, 100%);
      border: 1px solid rgba(39, 151, 216, 0.18);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 42px rgba(15, 23, 42, 0.12);
      padding: 12px 14px;
    }
    h1 { margin: 0 0 5px; font-size: 15px; line-height: 1.4; letter-spacing: 0; }
    p { margin: 0; color: #64748b; font-size: 12px; line-height: 1.6; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      border-radius: 999px;
      border: 1px solid #d8eafb;
      background: #f8fbff;
      color: #2563a8;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 900;
    }
    .chip.warn { color: #be123c; border-color: #fecdd3; background: #fff1f2; }
  </style>
</head>
<body>
  <div class="hud">
    <section class="card">
      <h1>WebXRでWebGPU対応とWebGL代替を確認</h1>
      <p>このWebXR表示自体は広く動くWebGLで描画し、端末がWebGPUに対応しているかを同時に表示します。</p>
      <div class="chips">
        <span class="chip" id="gpuState">WebGPU確認中</span>
        <span class="chip" id="xrState">WebXR確認中</span>
        <span class="chip">WebGL代替表示あり</span>
      </div>
    </section>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { VRButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js";

    const gpuState = document.getElementById("gpuState");
    const xrState = document.getElementById("xrState");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fbff);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 40);
    camera.position.set(0, 1.55, 2.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    scene.add(new THREE.HemisphereLight(0xffffff, 0xb8d9ff, 2));
    const light = new THREE.DirectionalLight(0xffffff, 1.4);
    light.position.set(2, 4, 3);
    scene.add(light);

    const group = new THREE.Group();
    group.position.set(0, 1.35, -1.2);
    scene.add(group);

    const gpuCube = new THREE.Mesh(
      new THREE.BoxGeometry(0.42, 0.42, 0.42),
      new THREE.MeshStandardMaterial({ color: 0x17c8df, emissive: 0x073842, roughness: 0.35 }),
    );
    gpuCube.position.x = -0.65;
    group.add(gpuCube);

    const glCube = new THREE.Mesh(
      new THREE.BoxGeometry(0.42, 0.42, 0.42),
      new THREE.MeshStandardMaterial({ color: 0x8fb7dc, roughness: 0.55 }),
    );
    glCube.position.x = 0.65;
    group.add(glCube);

    const bridge = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 0.05, 0.05),
      new THREE.MeshStandardMaterial({ color: 0xe11d48, emissive: 0x300812 }),
    );
    group.add(bridge);

    const floor = new THREE.GridHelper(4, 16, 0x8bc7eb, 0xd8eafb);
    floor.position.y = 0;
    scene.add(floor);

    async function detect() {
      const hasXR = !!navigator.xr;
      xrState.textContent = hasXR ? "WebXRあり" : "WebXRなし";
      xrState.classList.toggle("warn", !hasXR);

      if (!navigator.gpu) {
        gpuState.textContent = "WebGPU対応なし";
        gpuState.classList.add("warn");
        return;
      }
      try {
        const adapter = await navigator.gpu.requestAdapter();
        gpuState.textContent = adapter ? "WebGPU対応あり" : "WebGPU対応なし";
        gpuState.classList.toggle("warn", !adapter);
      } catch (_error) {
        gpuState.textContent = "WebGPU確認に失敗";
        gpuState.classList.add("warn");
      }
    }

    detect();

    renderer.xr.addEventListener("sessionstart", () => {
      xrState.textContent = "WebXRセッション中";
    });
    renderer.xr.addEventListener("sessionend", () => {
      xrState.textContent = "WebXRセッション終了";
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop((time) => {
      gpuCube.rotation.set(time * 0.001, time * 0.0013, 0);
      glCube.rotation.set(time * 0.0007, time * 0.0009, 0);
      bridge.scale.x = 0.85 + Math.sin(time * 0.003) * 0.12;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
