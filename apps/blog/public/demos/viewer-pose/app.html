<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer Pose</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Viewer Pose</h3>
        <div class="desc">XRFrame.getViewerPoseで得たビューアーポーズを使い、カメラ行列をシーンに適用するデモ。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        let headMesh;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x505050);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            scene.add(new THREE.GridHelper(10, 10));

            // A mesh that mimics the head movement but offset, so we can see it
            const geo = new THREE.BoxGeometry(0.2, 0.1, 0.15); // Goggles shape
            const mat = new THREE.MeshNormalMaterial();
            headMesh = new THREE.Mesh(geo, mat);
            scene.add(headMesh);
            
            // Mirror
            const mirrorGeo = new THREE.PlaneGeometry(2, 2);
            const mirrorMat = new THREE.MeshBasicMaterial({ color: 0x8888ff, side: THREE.DoubleSide, opacity: 0.5, transparent: true });
            const mirror = new THREE.Mesh(mirrorGeo, mirrorMat);
            mirror.position.set(0, 1.6, -2);
            scene.add(mirror);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // Update headMesh to match camera (viewer) but mirrored in front
            if (renderer.xr.isPresenting) {
                const _headPose = renderer.xr.getCamera(camera);
                // Simple visualization: place mesh at camera pos
                headMesh.position.copy(camera.position);
                headMesh.quaternion.copy(camera.quaternion);
                
                // Offset it to be a "ghost" that moves with you but slightly ahead
                // Or actually, let's put it in the mirror. 
                // The mirror is at z=-2. 
                // Reflection logic is complex, so let's just make the mesh follow camera
                // and user can see it if they look at themselves in a "mirror" (not implemented fully here).
            } else {
                headMesh.position.copy(camera.position);
                headMesh.quaternion.copy(camera.quaternion);
            }
            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
