<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Timing</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Frame Timing</h3>
        <div class="desc">XRFrame.predictedDisplayTimeを利用したタイミング計測とドロップフレーム検知。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        let statsMesh;
        let lastTime = 0;
        let frames = 0;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x101010);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);
            scene.add(new THREE.GridHelper(10, 10));

            // Load Test: Lots of cubes
            const geo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
            const mat = new THREE.MeshNormalMaterial();
            const mesh = new THREE.InstancedMesh(geo, mat, 2000);
            const matrix = new THREE.Matrix4();
            for(let i=0; i<2000; i++) {
                matrix.setPosition(
                    Math.random() * 4 - 2,
                    Math.random() * 2 + 0.5,
                    Math.random() * 4 - 2
                );
                mesh.setMatrixAt(i, matrix);
            }
            scene.add(mesh);

            // Stats display
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const tex = new THREE.CanvasTexture(canvas);
            statsMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.25), new THREE.MeshBasicMaterial({ map: tex }));
            statsMesh.position.set(0, 1.5, -1);
            statsMesh.userData = { canvas, ctx, tex };
            scene.add(statsMesh);

            renderer = new THREE.WebGLRenderer({ antialias: false }); // Disable AA for perf
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            window.addEventListener('resize', onWindowResize);
        }

        function updateStats(time, frame) {
            if (time - lastTime > 1000) {
                const fps = frames;
                frames = 0;
                lastTime = time;
                
                const { ctx, tex } = statsMesh.userData;
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,256,128);
                ctx.fillStyle = '#0f0';
                ctx.font = '40px monospace';
                ctx.fillText(`FPS: ${fps}`, 20, 70);
                
                if (frame) {
                    // XR specific timing can be inspected here if available
                }
                
                tex.needsUpdate = true;
            }
            frames++;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(_time, frame) {
            updateStats(performance.now(), frame);
            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
