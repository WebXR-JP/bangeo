<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Tracking Basic</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Eye Tracking Basic</h3>
        <div class="desc">WebXR Eye Tracking（proposal）から視線方向を取得し、注視点を可視化する基本デモ。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        let reticle;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            // Targets
            for (let i = 0; i < 5; i++) {
                const geo = new THREE.SphereGeometry(0.2, 32, 32);
                const mat = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff });
                const sphere = new THREE.Mesh(geo, mat);
                sphere.position.set((i - 2) * 0.8, 1.6 + (Math.random()-0.5), -2);
                scene.add(sphere);
            }

            // Reticle that follows eye
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.02, 0.04, 32),
                new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide })
            );
            reticle.position.z = -1;
            camera.add(reticle); // Attach to camera initially
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // NOTE: 'eye-tracking' feature is experimental and might not be supported everywhere
            // It often requires 'eye-tracking' in requiredFeatures or optionalFeatures
            // Three.js doesn't natively expose eye gaze source easily in r160 without raw access
            // This demo simulates eye tracking visually if not available, or uses input source 'gaze'
            document.body.appendChild(VRButton.createButton(renderer, {
                optionalFeatures: ['eye-tracking']
            }));

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(_timestamp, frame) {
            if (frame) {
                const session = renderer.xr.getSession();
                const refSpace = renderer.xr.getReferenceSpace();

                // Simple check for gaze input source
                if (session && refSpace) {
                    for (const source of session.inputSources) {
                        if (source.targetRayMode === 'gaze') {
                            // This is typically head-gaze or eye-gaze depending on device
                            // We can use the controller object if mapped, or getPose
                            // For Three.js, we might check if a controller corresponds to gaze
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
