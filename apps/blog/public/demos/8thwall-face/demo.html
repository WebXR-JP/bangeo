<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>8th Wall OSS + A-Frame Face Tracking Demo</title>

	<!-- A-Frame -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

	<!-- 8th Wall XRExtras (A-Frame components 含む) -->
	<script src="../xr-standalone/xrextras.js"></script>

	<!-- 8th Wall Engine (OSS版 - Face chunk preload) -->
	<script async src="../xr-standalone/xr.js"
		data-preload-chunks="face"></script>

	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { overflow: hidden; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background: #000; }

		#overlay {
			position: absolute; top: 0; left: 0; width: 100%; z-index: 50;
			pointer-events: none;
		}
		.header {
			display: flex; justify-content: space-between; align-items: center;
			padding: 12px 16px;
			background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
		}
		.header-title { color: #fff; font-size: 14px; font-weight: 700; }
		.header-badge {
			font-size: 10px; font-weight: 600; padding: 4px 10px;
			border-radius: 999px; background: rgba(74,222,128,0.2); color: #4ade80;
		}
		.back-link {
			position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
			pointer-events: auto; background: rgba(255,255,255,0.1);
			border: 1px solid rgba(255,255,255,0.2); color: #fff;
			padding: 10px 24px; border-radius: 999px; font-size: 11px;
			font-weight: 700; text-decoration: none; backdrop-filter: blur(8px);
			z-index: 100;
		}
		.back-link:hover { background: rgba(255,255,255,0.2); }

		#error-overlay {
			display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
			background: rgba(0,0,0,0.9); z-index: 200;
			justify-content: center; align-items: center; text-align: center; color: #fff;
			padding: 32px;
		}
		#error-overlay h2 { font-size: 20px; margin-bottom: 16px; }
		#error-overlay p { font-size: 14px; color: #aaa; line-height: 1.8; margin-bottom: 20px; }
		#error-overlay a { color: #e11d48; }
	</style>
</head>
<body>
	<!-- A-Frame scene with 8th Wall Face Tracking -->
	<a-scene
		xrface
		xrextras-loading
		xrextras-runtime-error
		renderer="colorManagement: true"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-camera position="0 0 0" active="false"></a-camera>

		<!-- 顔メッシュを半透明で表示 -->
		<a-entity xrextras-face-mesh="opacity: 0.4; color: #4488ff"></a-entity>

		<!-- 特徴点マーカー -->
		<a-entity xrextras-face-attachment="point: noseTip">
			<a-sphere radius="0.015" color="#EF2D5E"></a-sphere>
		</a-entity>

		<a-entity xrextras-face-attachment="point: forehead">
			<a-sphere radius="0.015" color="#9333ea"></a-sphere>
		</a-entity>

		<a-entity xrextras-face-attachment="point: leftEye">
			<a-sphere radius="0.012" color="#4CC3D9"></a-sphere>
		</a-entity>

		<a-entity xrextras-face-attachment="point: rightEye">
			<a-sphere radius="0.012" color="#4CC3D9"></a-sphere>
		</a-entity>

		<a-entity xrextras-face-attachment="point: mouth">
			<a-sphere radius="0.012" color="#FFC65D"></a-sphere>
		</a-entity>

		<a-entity xrextras-face-attachment="point: chin">
			<a-sphere radius="0.012" color="#7BC8A4"></a-sphere>
		</a-entity>

		<a-entity xrextras-face-attachment="point: leftEar">
			<a-sphere radius="0.01" color="#f97316"></a-sphere>
		</a-entity>

		<a-entity xrextras-face-attachment="point: rightEar">
			<a-sphere radius="0.01" color="#f97316"></a-sphere>
		</a-entity>

		<!-- 環境光 -->
		<a-light type="ambient" color="#888"></a-light>
		<a-light type="directional" position="0 1 1" intensity="0.8"></a-light>
	</a-scene>

	<!-- UI overlay -->
	<div id="overlay">
		<div class="header">
			<span class="header-title">Face Tracking (8th Wall OSS)</span>
			<span class="header-badge">OSS版</span>
		</div>
	</div>
	<a href="/demos/8thwall-aframe/demo.html" class="back-link">← カメラARデモ</a>

	<!-- Error fallback -->
	<div id="error-overlay">
		<div>
			<h2>8th Wall エンジンを読み込めませんでした</h2>
			<p>
				8th Wall OSS エンジン（xr.js）のセットアップが必要です。<br>
				<a href="https://github.com/8thwall/8thwall" target="_blank">8thwall/8thwall</a>
				からソースをビルドするか、<br>
				<a href="https://github.com/8thwall/engine" target="_blank">8thwall/engine</a>
				から xr-standalone.zip をダウンロードしてください。
			</p>
		</div>
	</div>

	<script>
		// 8th Wall engine load check
		let engineLoaded = false;
		const checkEngine = () => {
			if (window.XR8 && typeof window.XR8.run === "function") {
				engineLoaded = true;
			}
		};
		window.addEventListener("xrloaded", checkEngine);
		setTimeout(() => {
			checkEngine();
			if (!engineLoaded) {
				document.getElementById("error-overlay").style.display = "flex";
			}
		}, 8000);
	</script>
</body>
</html>
