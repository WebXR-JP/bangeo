<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grab Interaction</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Grab Interaction</h3>
        <div class="desc">ピンチ/トリガーでオブジェクトを掴み、親子付けして移動・回転させるグラブ操作デモ。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/XRControllerModelFactory.js';

        // --- Demo Implementation ---
        
        // Same logic as ray-casting basically, but focusing on the grab mechanism.
        // Reusing the ray-casting code is fine, but let's make it simpler for 'grab'.
        // Actually ray-casting demo above already implements grabbing.
        // Let's copy it but maybe change the objects to handleable tools.
        grab-interaction
        
        let camera, scene, renderer;
        let controller1, controller2;
        let raycaster;
        const _intersected = [];
        const tempMatrix = new THREE.Matrix4();
        let group;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x505050);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            const floorGeometry = new THREE.PlaneGeometry(4, 4);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            scene.add(new THREE.HemisphereLight(0x808080, 0x606060));
            scene.add(new THREE.DirectionalLight(0xffffff));

            group = new THREE.Group();
            scene.add(group);

            // Create some handleable cubes
            for (let i = 0; i < 10; i++) {
                const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                const object = new THREE.Mesh(geometry, material);
                object.position.set(Math.random() * 2 - 1, Math.random() + 0.5, Math.random() * 2 - 1);
                group.add(object);
            }

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            scene.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectend', onSelectEnd);
            scene.add(controller2);
            
            // Add lines
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]);
            const line = new THREE.Line(lineGeo);
            controller1.add(line.clone());
            controller2.add(line.clone());

            const controllerModelFactory = new XRControllerModelFactory();
            const grip1 = renderer.xr.getControllerGrip(0);
            grip1.add(controllerModelFactory.createControllerModel(grip1));
            scene.add(grip1);
            const grip2 = renderer.xr.getControllerGrip(1);
            grip2.add(controllerModelFactory.createControllerModel(grip2));
            scene.add(grip2);

            raycaster = new THREE.Raycaster();
            window.addEventListener('resize', onWindowResize);
        }

        function onSelectStart(event) {
            const controller = event.target;
            const intersections = getIntersections(controller);
            if (intersections.length > 0) {
                const object = intersections[0].object;
                controller.attach(object);
                controller.userData.selected = object;
            }
        }

        function onSelectEnd(event) {
            const controller = event.target;
            if (controller.userData.selected !== undefined) {
                const object = controller.userData.selected;
                group.attach(object);
                controller.userData.selected = undefined;
            }
        }

        function getIntersections(controller) {
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            return raycaster.intersectObjects(group.children, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() { renderer.setAnimationLoop(render); }
        function render() { renderer.render(scene, camera); }
    
    </script>
</body>
</html>
