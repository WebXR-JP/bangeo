<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Interaction in XR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>UI Interaction in XR</h3>
        <div class="desc">ワールド空間に置いたUIパネルをレイキャストでフォーカスし、hover/select状態を持たせるデモ。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        let controller1;
        let raycaster;
        let uiGroup;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);
            scene.add(new THREE.GridHelper(10, 10));

            // Create UI Panel
            uiGroup = new THREE.Group();
            uiGroup.position.set(0, 1.5, -1.5);
            scene.add(uiGroup);
            
            const bg = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x444 }));
            uiGroup.add(bg);
            
            const btn1 = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.2), new THREE.MeshBasicMaterial({ color: 0x0088ff }));
            btn1.position.y = 0.3;
            btn1.userData = { id: 'btn1', color: 0x0088ff };
            uiGroup.add(btn1);
            
            const btn2 = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.2), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
            btn2.position.y = 0.0;
            btn2.userData = { id: 'btn2', color: 0x00ff88 };
            uiGroup.add(btn2);
            
            const btn3 = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.2), new THREE.MeshBasicMaterial({ color: 0xff8800 }));
            btn3.position.y = -0.3;
            btn3.userData = { id: 'btn3', color: 0xff8800 };
            uiGroup.add(btn3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelect);
            scene.add(controller1);

            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]));
            controller1.add(line);
            
            raycaster = new THREE.Raycaster();
            window.addEventListener('resize', onWindowResize);
        }
        
        function onSelect() {
            const intersects = getIntersects();
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.userData.id) {
                    obj.material.color.setHex(Math.random() * 0xffffff);
                }
            }
        }
        
        function getIntersects() {
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller1.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller1.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            return raycaster.intersectObjects(uiGroup.children);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() { renderer.setAnimationLoop(render); }

        function render() {
            // Hover effect
            const intersects = getIntersects();
            // Reset colors
            uiGroup.children.forEach(c => {
                if (c.userData.color) c.material.color.setHex(c.userData.color);
            });
            
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.userData.id) {
                    obj.material.color.offsetHSL(0, 0, 0.2); // Lighten
                }
            }

            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
