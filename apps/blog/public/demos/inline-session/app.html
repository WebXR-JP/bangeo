<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Session</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 100; text-shadow: 0 1px 2px black;
        }
        #info a { color: #f4a83a; pointer-events: auto; }
        .desc { font-size: 0.8em; opacity: 0.8; margin-top: 4px; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Inline Session</h3>
        <div class="desc">inlineセッションを使用した非没入型XR体験。</div>
        <div style="margin-top: 10px;">
            <a href="/">Back to Demos</a>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- Demo Implementation ---
        
        let camera, scene, renderer;
        let cube;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);
            
            // Title for inline
            const info = document.createElement('div');
            info.style.position = 'absolute';
            info.style.top = '10px';
            info.style.color = 'white';
            info.innerText = 'Inline Session (Magic Window)';
            container.appendChild(info);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x330000);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 0, 3);

            cube = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshNormalMaterial());
            scene.add(cube);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // Use XR for inline if supported
            container.appendChild(renderer.domElement);
            
            // Auto start inline session
            if (navigator.xr) {
                navigator.xr.isSessionSupported('inline').then((supported) => {
                    if (supported) {
                        navigator.xr.requestSession('inline').then((session) => {
                            renderer.xr.setSession(session);
                        });
                    }
                });
            }

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
    
    </script>
</body>
</html>
